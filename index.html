<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weekend Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        deepblue: '#0b132b',
                        orange: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b132b; color: #f8fafc; overflow-x: hidden; touch-action: manipulation; }
        .glass { background: rgba(11, 19, 43, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.9; transform: scale(1.05); transition: transform 0.1s; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.open { transform: translateY(0); }
        .modal-fade { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-fade.open { opacity: 1; pointer-events: auto; }
        
        /* Month Themes */
        .theme-0 { background: rgba(14, 165, 233, 0.05); border-left-color: #0ea5e9; } /* Sky */
        .theme-1 { background: rgba(244, 63, 94, 0.05); border-left-color: #f43f5e; } /* Rose */
        .theme-2 { background: rgba(16, 185, 129, 0.05); border-left-color: #10b981; } /* Emerald */
        .theme-3 { background: rgba(245, 158, 11, 0.05); border-left-color: #f59e0b; } /* Amber */
        .theme-4 { background: rgba(168, 85, 247, 0.05); border-left-color: #a855f7; } /* Purple */
        .theme-5 { background: rgba(234, 88, 12, 0.05); border-left-color: #ea580c; } /* Orange */
        .theme-6 { background: rgba(6, 182, 212, 0.05); border-left-color: #06b6d4; } /* Cyan */
        .theme-7 { background: rgba(99, 102, 241, 0.05); border-left-color: #6366f1; } /* Indigo */
        .theme-8 { background: rgba(20, 184, 166, 0.05); border-left-color: #14b8a6; } /* Teal */
        .theme-9 { background: rgba(236, 72, 153, 0.05); border-left-color: #ec4899; } /* Pink */
        .theme-10 { background: rgba(139, 92, 246, 0.05); border-left-color: #8b5cf6; } /* Violet */
        .theme-11 { background: rgba(59, 130, 246, 0.05); border-left-color: #3b82f6; } /* Blue */
    </style>
</head>
<body class="font-sans antialiased text-sm md:text-base">

<div id="app" class="min-h-screen pb-24"></div>

<script>
/**
 * Application State & Configuration
 */
const state = {
    user: null,
    viewMode: 'scroll', // 'scroll' | 'fit'
    plans: {}, // Keyed by YYYY-MM-DD
    collapsedMonths: {}, // { 0: true/false }
    editingDate: null
};

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const TIMES = Array.from({ length: 36 }, (_, i) => {
    const h = Math.floor(i / 2) + 6;
    const m = i % 2 === 0 ? '00' : '30';
    return `${h.toString().padStart(2, '0')}:${m}`;
});

function getYearWeekends(year = 2026) {
    const weekends = [];
    let d = new Date(year, 0, 1);

    while (d.getFullYear() === year) {
        if (d.getDay() === 6) {
            const sat = new Date(d);
            const sun = new Date(d);
            sun.setDate(sun.getDate() + 1);

            if (sun.getFullYear() === year) {
                weekends.push({ sat, sun, month: sat.getMonth() });
            }
        }

        d.setDate(d.getDate() + 1);
    }

    return weekends;
}

const weekendsData = getYearWeekends(2026);
const groupedByMonth = MONTHS.map((_, i) => weekendsData.filter(w => w.month === i));

const Storage = {
    getKey: () => `wp_data_${state.user || 'local'}`,
    load: () => {
        const data = localStorage.getItem(Storage.getKey());
        state.plans = data ? JSON.parse(data) : {};
    },
    save: () => {
        localStorage.setItem(Storage.getKey(), JSON.stringify(state.plans));
    }
};

/**
 * UI Rendering
 */
function renderApp() {
    const app = document.getElementById('app');
    app.innerHTML = `
        ${renderHeader()}
        <main class="pt-28 px-2 md:px-6 mx-auto max-w-7xl">
            ${state.viewMode === 'scroll' ? renderScrollView() : renderFitView()}
        </main>
        ${renderModals()}
    `;
    lucide.createIcons();
    attachDragAndDrop();
}

function renderHeader() {
    const jumpBar = MONTHS.map((m, i) => `
        <button data-action="jump" data-month="${i}" class="px-4 py-2 text-xs font-semibold rounded-full bg-white/5 hover:bg-white/10 whitespace-nowrap transition-colors">
            ${m}
        </button>
    `).join('');

    return `
        <header class="fixed top-0 w-full z-40 glass">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-orange-600 flex items-center justify-center shadow-lg shadow-orange-600/20">
                        <i data-lucide="calendar" class="w-4 h-4 text-white"></i>
                    </div>
                    <h1 class="font-bold text-lg tracking-tight hidden sm:block">Planner</h1>
                </div>
                
                <div class="flex bg-white/5 rounded-full p-1">
                    <button data-action="set-view" data-view="scroll" class="px-3 py-1.5 rounded-full text-xs font-medium transition-all ${state.viewMode === 'scroll' ? 'bg-orange-600 text-white' : 'text-slate-400'}">Scroll</button>
                    <button data-action="set-view" data-view="fit" class="px-3 py-1.5 rounded-full text-xs font-medium transition-all ${state.viewMode === 'fit' ? 'bg-orange-600 text-white' : 'text-slate-400'}">Year Fit</button>
                </div>

                <div class="flex items-center gap-2">
                    ${state.user 
                        ? `<button data-action="auth-modal" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-xs font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> @${state.user}
                           </button>`
                        : `<button data-action="auth-modal" class="px-4 py-1.5 rounded-full bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold transition-all">Sign In</button>`
                    }
                </div>
            </div>
            
            ${state.viewMode === 'scroll' ? `
            <div class="max-w-7xl mx-auto px-2 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar border-t border-white/5 relative">
                <div class="flex gap-1 flex-1">${jumpBar}</div>
                <div class="flex items-center gap-1 pl-2 border-l border-white/10">
                    <button data-action="expand-all" class="p-2 rounded-full bg-white/5 hover:bg-white/10" title="Expand All"><i data-lucide="chevrons-down" class="w-4 h-4"></i></button>
                    <button data-action="collapse-all" class="p-2 rounded-full bg-white/5 hover:bg-white/10" title="Collapse All"><i data-lucide="chevrons-up" class="w-4 h-4"></i></button>
                </div>
            </div>` : ''}
        </header>
    `;
}

function formatDate(date) {
    return date.toISOString().split('T')[0];
}

function renderDayCard(date, label) {
    const dateStr = formatDate(date);
    const plan = state.plans[dateStr];
    const isDraft = plan?.status === 'draft';
    const isConfirmed = plan?.status === 'confirmed';
    
    let borderClass = 'border-white/5';
    let badge = '';
    
    if (isDraft) {
        borderClass = 'border-amber-500/50 border-dashed';
        badge = `<div class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.5)]"></div>`;
    } else if (isConfirmed) {
        borderClass = 'border-emerald-500/50 border-solid';
        badge = `<div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>`;
    }

    const hasTime = plan?.start && plan?.end;
    const timeDisplay = hasTime ? `<span class="text-[10px] font-medium px-2 py-0.5 rounded bg-white/10 text-slate-300 ml-2">${plan.start}–${plan.end}</span>` : '';

    return `
        <div data-date="${dateStr}" class="day-dropzone relative flex-1 p-3 rounded-xl glass-card ${borderClass} hover:bg-white/5 cursor-pointer transition-all min-h-[80px] flex flex-col gap-1">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-semibold text-slate-400">${label} ${date.getDate()}</span>${badge}
            </div>
            ${plan ? `
                <div class="text-sm font-medium text-white break-words leading-tight flex flex-wrap items-center">
                    ${plan.title} ${timeDisplay}
                </div>
            ` : `<div class="text-xs text-slate-600 font-medium italic opacity-50 mt-1">Free</div>`}
        </div>
    `;
}

function renderScrollView() {
    return groupedByMonth.map((weekends, monthIndex) => {
        const isCollapsed = state.collapsedMonths[monthIndex];
        const monthName = MONTHS[monthIndex];
        
        return `
            <section id="month-${monthIndex}" class="mb-6 rounded-2xl border-l-4 theme-${monthIndex} overflow-hidden transition-all duration-300">
                <div data-action="toggle-month" data-month="${monthIndex}" class="px-4 py-3 flex items-center justify-between cursor-pointer hover:bg-white/5">
                    <h2 class="text-lg font-bold tracking-tight">${monthName}</h2>
                    <i data-lucide="${isCollapsed ? 'chevron-down' : 'chevron-up'}" class="w-5 h-5 text-slate-400"></i>
                </div>
                ${!isCollapsed ? `
                <div class="p-2 sm:p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${weekends.map(w => `
                        <div class="flex gap-2 p-2 rounded-2xl bg-white/[0.02] border border-white/5">
                            <div class="flex flex-col justify-center items-center px-1 min-w-[24px]">
                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block rotate-180" style="writing-mode: vertical-rl;">${monthName}</span>
                            </div>
                            ${renderDayCard(w.sat, 'Sat')}${renderDayCard(w.sun, 'Sun')}
                        </div>
                    `).join('')}
                </div>` : ''}
            </section>
        `;
    }).join('');
}

function renderFitView() {
    return `
        <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 h-[calc(100vh-140px)] overflow-hidden">
            ${groupedByMonth.map((weekends, monthIndex) => `
                <div class="rounded-2xl border-l-2 theme-${monthIndex} p-3 flex flex-col gap-2 relative glass-card">
                    <h3 class="text-sm font-bold opacity-80">${MONTHS[monthIndex]}</h3>
                    <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-1.5">
                        ${weekends.map(w => {
                            const satStr = formatDate(w.sat);
                            const sunStr = formatDate(w.sun);
                            const pSat = state.plans[satStr];
                            const pSun = state.plans[sunStr];
                            
                            const getDot = p => {
                                if(!p) return 'bg-white/10';
                                return p.status === 'confirmed' ? 'bg-emerald-500' : 'bg-amber-500';
                            };

                            return `
                                <div class="flex items-center justify-between text-[10px] font-medium bg-white/5 rounded px-2 py-1.5">
                                    <div data-date="${satStr}" class="day-dropzone flex items-center gap-1 cursor-pointer hover:text-orange-400 flex-1">
                                        <div class="w-1.5 h-1.5 rounded-full ${getDot(pSat)}"></div> ${w.sat.getDate()}
                                    </div>
                                    <div class="w-px h-3 bg-white/10 mx-1"></div>
                                    <div data-date="${sunStr}" class="day-dropzone flex items-center gap-1 cursor-pointer hover:text-orange-400 flex-1 justify-end">
                                        ${w.sun.getDate()} <div class="w-1.5 h-1.5 rounded-full ${getDot(pSun)}"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderModals() {
    const editPlan = state.editingDate ? state.plans[state.editingDate] || { title: '', status: 'draft', start: '', end: '' } : null;
    
    return `
        <!-- Account Modal -->
        <div id="auth-modal" class="fixed inset-0 z-[60] bg-deepblue/80 backdrop-blur-sm flex items-center justify-center modal-fade px-4">
            <div class="bg-slate-900 border border-white/10 p-6 rounded-3xl w-full max-w-sm shadow-2xl" data-stop-propagation>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Account</h2>
                    <button data-action="close-modal" class="p-2 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                ${state.user ? `
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 rounded-full bg-orange-600/20 text-orange-500 mx-auto flex items-center justify-center mb-3">
                            <i data-lucide="user" class="w-8 h-8"></i>
                        </div>
                        <p class="text-lg font-semibold">@${state.user}</p>
                        <p class="text-xs text-emerald-500 font-medium mt-1">Data saved securely to device.</p>
                    </div>
                    <div class="flex flex-col gap-3">
                        <button data-action="clear-data" class="w-full py-3 rounded-xl border border-red-500/30 text-red-400 font-semibold text-sm hover:bg-red-500/10 transition-colors">Clear All Plans</button>
                        <button data-action="logout" class="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 font-semibold text-sm transition-colors">Sign Out</button>
                    </div>
                ` : `
                    <div class="flex flex-col gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                            <input id="auth-user" type="text" placeholder="Enter username" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 focus:placeholder-transparent transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                            <input id="auth-pass" type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 focus:placeholder-transparent transition-all">
                        </div>
                        <button data-action="login" class="w-full mt-2 py-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-sm shadow-lg shadow-orange-600/20 transition-all">Sign In / Register</button>
                    </div>
                `}
            </div>
        </div>

        <!-- Confirm Modal -->
        <div id="confirm-modal" class="fixed inset-0 z-[70] bg-deepblue/90 backdrop-blur-md flex items-center justify-center modal-fade px-4">
            <div class="bg-slate-900 border border-red-500/30 p-6 rounded-3xl w-full max-w-sm text-center" data-stop-propagation>
                <div class="w-12 h-12 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle"></i></div>
                <h3 class="text-lg font-bold mb-2">Clear Year Data?</h3>
                <p class="text-sm text-slate-400 mb-6">This will permanently delete all plans for this account. This cannot be undone.</p>
                <div class="flex gap-3">
                    <button data-action="cancel-clear" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 font-semibold text-sm">Cancel</button>
                    <button data-action="confirm-clear" class="flex-1 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold text-sm shadow-lg shadow-red-500/20">Yes, Clear</button>
                </div>
            </div>
        </div>

        <!-- Edit Plan Bottom Sheet / Modal -->
        <div id="edit-sheet" class="fixed inset-0 z-[50] bg-deepblue/60 backdrop-blur-sm modal-fade flex items-end sm:items-center">
            <div class="w-full max-w-xl mx-auto rounded-t-3xl sm:rounded-3xl bg-slate-900 border border-white/10 p-5 shadow-2xl bottom-sheet" data-stop-propagation>
                <div class="flex items-center justify-between mb-5">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Weekend Plan</p>
                        <h3 class="text-xl font-bold">${editPlan ? 'Edit Plan' : 'New Plan'}</h3>
                    </div>
                    <button data-action="close-edit" class="p-2 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Title</label>
                        <input id="plan-title" type="text" value="${(editPlan?.title || '').replace(/"/g, '&quot;')}" placeholder="Lunch, hike, brunch..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Start</label>
                            <input id="plan-start" type="time" value="${editPlan?.start || ''}" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">End</label>
                            <input id="plan-end" type="time" value="${editPlan?.end || ''}" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Status</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button data-action="set-status" data-status="draft" class="py-2.5 rounded-xl border text-sm font-medium transition-all ${editPlan?.status === 'draft' || !editPlan ? 'border-amber-500/50 bg-amber-500/10 text-amber-300' : 'border-white/10 bg-white/5 text-slate-300'}">Draft</button>
                            <button data-action="set-status" data-status="confirmed" class="py-2.5 rounded-xl border text-sm font-medium transition-all ${editPlan?.status === 'confirmed' ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-300' : 'border-white/10 bg-white/5 text-slate-300'}">Confirmed</button>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex gap-3 pt-2 border-t border-white/10">
                    <button data-action="delete-plan" class="flex-1 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 font-semibold text-sm hover:bg-red-500/15 transition-colors ${editPlan ? '' : 'opacity-40 pointer-events-none'}">Delete</button>
                    <button data-action="save-plan" class="flex-1 py-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-sm shadow-lg shadow-orange-600/20 transition-all">Save Plan</button>
                </div>
            </div>
        </div>
    `;
}
</script>
</body>
</html>
